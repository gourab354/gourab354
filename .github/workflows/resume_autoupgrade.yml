name: Autonomous Resume Auto-Upgrade & Telemetry Engine

on:
  schedule:
    # Runs every Sunday at midnight UTC to auto-sync latest projects and achievements
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'resume_data.json'
      - 'resume_upgrader.py'

permissions:
  contents: write

jobs:
  upgrade-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Resume Auto-Upgrade Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python resume_upgrader.py --sync --generate

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s resume_data.json public/ dist/) ]]; then
            git add resume_data.json public/ dist/
            git commit -m "🤖 [Auto-Resume] Upgrade resume telemetry, PDF & DOCX artifacts [skip ci]"
            git push
          else
            echo "Resume assets are already fully up to date."
          fi
