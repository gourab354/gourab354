<svg width="740" height="370" viewBox="0 0 740 370" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>About Gourab — Robotics, IoT &amp; AI Architect</title>
  <desc>Cyberpunk HUD card showcasing Gourab's credentials, hackathon victories, and tech stack</desc>

  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff00aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1322" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&amp;family=Share+Tech+Mono&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

      .card { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .c1 { animation-delay: 0.08s; }
      .c2 { animation-delay: 0.16s; }
      .c3 { animation-delay: 0.24s; }
      .c4 { animation-delay: 0.32s; }
      .c5 { animation-delay: 0.40s; }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .title-txt {
        font-family: 'Orbitron', monospace;
        font-size: 28px;
        font-weight: 900;
        fill: #00ffff;
        letter-spacing: 5px;
        filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.6));
      }
      .sub-txt {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #ff33aa;
        letter-spacing: 3px;
      }
      .label {
        font-family: 'Share Tech Mono', monospace;
        font-size: 9.5px;
        fill: #ff00aa;
        letter-spacing: 2px;
      }
      .val {
        font-family: 'JetBrains Mono', 'Share Tech Mono', monospace;
        font-size: 12px;
        fill: #d8eeff;
      }
      .val-cyan { fill: #00ffff; font-family: 'Share Tech Mono', monospace; font-size: 12px; }
      .val-green { fill: #39ff14; font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: bold; }
      .val-gold { fill: url(#goldGrad); font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 800; }
      .val-pink { fill: #ff66cc; font-family: 'Share Tech Mono', monospace; font-size: 12px; }

      .badge-bold {
        font-family: 'Orbitron', monospace;
        font-size: 14px;
        font-weight: 900;
        fill: #00ffff;
      }
      .badge-gold {
        font-family: 'Orbitron', monospace;
        font-size: 14px;
        font-weight: 900;
        fill: #ffdd44;
        filter: drop-shadow(0 0 6px rgba(255, 221, 68, 0.5));
      }

      .tag-txt {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
      }

      .pulse-dot {
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }

      .scanline {
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(0); opacity: 0.08; }
        50% { opacity: 0.16; }
        100% { transform: translateY(370px); opacity: 0.08; }
      }
    </style>

    <clipPath id="main-clip">
      <rect width="740" height="370" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background base -->
  <rect width="740" height="370" rx="16" fill="#060911"/>
  
  <!-- Outer glowing border -->
  <rect x="1" y="1" width="738" height="368" rx="15" fill="none" stroke="url(#neonGlow)" stroke-width="1.2" opacity="0.6"/>

  <!-- Grid lines -->
  <g clip-path="url(#main-clip)" opacity="0.05">
    <line x1="0" y1="37" x2="740" y2="37" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="0" y1="74" x2="740" y2="74" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="0" y1="111" x2="740" y2="111" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="0" y1="148" x2="740" y2="148" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="0" y1="185" x2="740" y2="185" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="0" y1="222" x2="740" y2="222" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="0" y1="259" x2="740" y2="259" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="0" y1="296" x2="740" y2="296" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="0" y1="333" x2="740" y2="333" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="37" y1="0" x2="37" y2="370" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="74" y1="0" x2="74" y2="370" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="148" y1="0" x2="148" y2="370" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="222" y1="0" x2="222" y2="370" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="296" y1="0" x2="296" y2="370" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="370" y1="0" x2="370" y2="370" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="444" y1="0" x2="444" y2="370" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="518" y1="0" x2="518" y2="370" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="592" y1="0" x2="592" y2="370" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="666" y1="0" x2="666" y2="370" stroke="#00ffff" stroke-width="0.8"/>
    <line x1="703" y1="0" x2="703" y2="370" stroke="#00ffff" stroke-width="0.8"/>
  </g>

  <!-- Laser scanline sweep -->
  <rect class="scanline" x="0" y="-30" width="740" height="30" fill="#00ffff" clip-path="url(#main-clip)"/>

  <!-- Futuristic corner brackets -->
  <g stroke="#00ffff" stroke-width="2" fill="none" opacity="0.8">
    <polyline points="22,44 22,22 44,22"/>
    <polyline points="696,22 718,22 718,44"/>
    <polyline points="22,326 22,348 44,348"/>
    <polyline points="696,348 718,348 718,326"/>
  </g>

  <!-- Top bar / HUD title -->
  <text x="370" y="52" text-anchor="middle" class="title-txt">GOURAB // SYSTEM HUD</text>
  <text x="370" y="70" text-anchor="middle" class="sub-txt">ROBOTICS ARCHITECT · EMBEDDED SYSTEMS · COMPUTER VISION &amp; AI</text>

  <!-- Divider line -->
  <line x1="36" y1="80" x2="704" y2="80" stroke="#00ffff" stroke-width="0.8" opacity="0.35"/>

  <!-- CARD 1: Identity & Archetype -->
  <g class="card c1">
    <rect x="28" y="92" width="206" height="84" rx="10" fill="url(#cardBgGrad)" stroke="#00ffff" stroke-width="1" stroke-opacity="0.35"/>
    <text x="40" y="110" class="label">// OPERATIVE INFO</text>
    <text x="40" y="128"><tspan class="val-cyan">CALLSIGN</tspan><tspan class="val"> — Gourab</tspan></text>
    <text x="40" y="146"><tspan class="val-cyan">ROLE</tspan><tspan class="val"> — Hardware/AI Dev</tspan></text>
    <text x="40" y="164"><tspan class="val-cyan">COLLEGE</tspan><tspan class="val"> — Tech Innovator</tspan></text>
  </g>

  <!-- CARD 2: Live Status & Build Engine -->
  <g class="card c2">
    <rect x="246" y="92" width="216" height="84" rx="10" fill="url(#cardBgGrad)" stroke="#39ff14" stroke-width="1" stroke-opacity="0.35"/>
    <text x="258" y="110" class="label">// RADAR &amp; STATUS</text>
    <circle cx="268" cy="128" r="5" fill="#39ff14" class="pulse-dot"/>
    <text x="280" y="132" class="val-green">LIVE // OVERCLOCKED</text>
    <text x="258" y="150" class="val">Building: Autonomous Drones</text>
    <text x="258" y="165" class="val">&amp; Quadruped Robotics</text>
  </g>

  <!-- CARD 3: Hackathon Trophy Core (9x Finalist & 4x Winner) -->
  <g class="card c3">
    <rect x="474" y="92" width="238" height="84" rx="10" fill="url(#cardBgGrad)" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.45"/>
    <text x="486" y="110" class="label">// HACKATHON GLORY</text>
    <text x="486" y="130">
      <tspan class="badge-gold">4×</tspan>
      <tspan class="val" font-weight="bold"> Hackathon WINNER 🏆</tspan>
    </text>
    <text x="486" y="148">
      <tspan class="badge-bold">9×</tspan>
      <tspan class="val"> Hackathon Finalist ⚡</tspan>
    </text>
    <text x="486" y="165">
      <tspan class="badge-gold">2×</tspan>
      <tspan class="val"> FOSET 1st Prize 🥇</tspan>
    </text>
  </g>

  <!-- CARD 4: Hardware & Silicon Engine -->
  <g class="card c4">
    <rect x="28" y="188" width="330" height="72" rx="10" fill="url(#cardBgGrad)" stroke="#9d4edd" stroke-width="1" stroke-opacity="0.35"/>
    <text x="40" y="206" class="label">// SILICON &amp; HARDWARE RIG</text>
    <text x="40" y="226" class="val">ESP32 · Raspberry Pi · STM32 · Arduino</text>
    <text x="40" y="244" class="val">Servos · ST7735 · Sensors · FreeRTOS</text>
  </g>

  <!-- CARD 5: Software & Intelligence Grid -->
  <g class="card c5">
    <rect x="370" y="188" width="342" height="72" rx="10" fill="url(#cardBgGrad)" stroke="#00ffff" stroke-width="1" stroke-opacity="0.35"/>
    <text x="382" y="206" class="label">// INTELLIGENCE &amp; WEB GRID</text>
    <text x="382" y="226" class="val">OpenCV · Python · TensorFlow · MediaPipe</text>
    <text x="382" y="244" class="val">C/C++ · Node.js · WebSockets · REST APIs</text>
  </g>

  <!-- FOCUS.SYS Label -->
  <text x="40" y="280" class="label">// PRIMARY PROTOCOLS &amp; AURA</text>

  <!-- Interactive Tags Pills -->
  <g class="card c1">
    <rect x="28" y="288" width="138" height="24" rx="12" fill="#00ffff" fill-opacity="0.12" stroke="#00ffff" stroke-width="0.8"/>
    <text x="97" y="304" text-anchor="middle" class="tag-txt" fill="#00ffff">🦾 Quadruped Crawlers</text>
  </g>

  <g class="card c2">
    <rect x="176" y="288" width="138" height="24" rx="12" fill="#39ff14" fill-opacity="0.12" stroke="#39ff14" stroke-width="0.8"/>
    <text x="245" y="304" text-anchor="middle" class="tag-txt" fill="#39ff14">🛸 Gesture Drones</text>
  </g>

  <g class="card c3">
    <rect x="324" y="288" width="128" height="24" rx="12" fill="#ffd700" fill-opacity="0.12" stroke="#ffd700" stroke-width="0.8"/>
    <text x="388" y="304" text-anchor="middle" class="tag-txt" fill="#ffd700">👁️ Computer Vision</text>
  </g>

  <g class="card c4">
    <rect x="462" y="288" width="122" height="24" rx="12" fill="#ff00aa" fill-opacity="0.12" stroke="#ff00aa" stroke-width="0.8"/>
    <text x="523" y="304" text-anchor="middle" class="tag-txt" fill="#ff00aa">⚡ IoT Smart Hubs</text>
  </g>

  <g class="card c5">
    <rect x="594" y="288" width="118" height="24" rx="12" fill="#00ffff" fill-opacity="0.12" stroke="#00ffff" stroke-width="0.8"/>
    <text x="653" y="304" text-anchor="middle" class="tag-txt" fill="#00ffff">💻 C++ &amp; Python</text>
  </g>

  <!-- Bottom Divider -->
  <line x1="36" y1="326" x2="704" y2="326" stroke="#00ffff" stroke-width="0.8" opacity="0.25"/>

  <!-- Footer Tagline -->
  <text x="370" y="348" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="11" fill="#00ffff" letter-spacing="3" opacity="0.85">
    [ HARDWARE TALKS · SOFTWARE LISTENS · I ENGINEER THE SYMPHONY ]
  </text>
</svg>
